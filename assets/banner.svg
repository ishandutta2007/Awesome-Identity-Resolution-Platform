<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="100%" height="250">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027">
        <animate attributeName="stop-color" values="#0f2027;#203a43;#2c5364;#0f2027" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#203a43">
        <animate attributeName="stop-color" values="#203a43;#2c5364;#0f2027;#203a43" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#2c5364">
        <animate attributeName="stop-color" values="#2c5364;#0f2027;#203a43;#2c5364" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="250" fill="url(#bg-grad)" rx="15" ry="15" />
  
  <!-- Grid overlay -->
  <rect width="1000" height="250" fill="url(#grid)" rx="15" ry="15" />

  <!-- Animated connection lines (Identity Graph concept) -->
  <g stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" fill="none">
    <path d="M100,125 Q200,50 300,125 T500,125 T700,125 T900,125">
      <animate attributeName="d" 
               values="M100,125 Q200,50 300,125 T500,125 T700,125 T900,125;
                       M100,125 Q200,200 300,125 T500,125 T700,125 T900,125;
                       M100,125 Q200,50 300,125 T500,125 T700,125 T900,125" 
               dur="8s" repeatCount="indefinite" />
    </path>
    <path d="M50,150 Q150,250 350,150 T650,150 T950,150">
      <animate attributeName="d" 
               values="M50,150 Q150,250 350,150 T650,150 T950,150;
                       M50,150 Q150,50 350,150 T650,150 T950,150;
                       M50,150 Q150,250 350,150 T650,150 T950,150" 
               dur="12s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Animated nodes -->
  <g fill="#00f2fe">
    <circle cx="100" cy="125" r="4">
      <animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="300" cy="125" r="4">
      <animate attributeName="r" values="4;8;4" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="500" cy="125" r="5">
      <animate attributeName="r" values="5;9;5" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="700" cy="125" r="4">
      <animate attributeName="r" values="4;8;4" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="900" cy="125" r="4">
      <animate attributeName="r" values="4;8;4" dur="2.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Main Text -->
  <g transform="translate(500, 125)" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="0" y="-15" font-size="42" font-weight="800" fill="url(#text-grad)" filter="url(#glow)">
      Awesome Identity Resolution Platform
    </text>
    <text x="0" y="30" font-size="18" font-weight="500" fill="#a0aec0" letter-spacing="2">
      SAAS CDP &amp; OPEN-SOURCE ENTITY RESOLUTION
    </text>
  </g>
</svg>
